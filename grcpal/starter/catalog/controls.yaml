  # ===================== Change management =====================
  - id: CHG-01
    title: Peer-reviewed, tested production changes
    description: >
      Production code and infrastructure change only through pull requests with at least one
      non-author approval and passing required checks; direct pushes to main are blocked.
    criteria: [CC5.1, CC5.2, CC6.8, CC8.1]
    owner: engineering-lead
    frequency: event
    type: automated
    evidence:
      - {artifact: Merged PR population with approvers and checks, via: "collector:github_changes"}
      - {artifact: Branch protection settings, via: "collector:github_branch_protection"}
    iso27001: [A.8.32, A.8.25]

  - id: CHG-02
    title: Infrastructure as code with scanning
    description: Azure infrastructure is defined in Bicep or Terraform and scanned in CI (Checkov or PSRule for Azure).
    criteria: [CC8.1, CC7.1]
    owner: engineering-lead
    frequency: event
    type: automated
    evidence:
      - {artifact: IaC scan results in PR checks, via: "collector:github_changes"}
    iso27001: [A.8.9, A.8.32]

  - id: CHG-03
    title: Emergency change procedure
    description: Emergency changes are labeled, deployed by an authorized engineer, and reviewed retroactively within 2 business days.
    criteria: [CC8.1]
    owner: engineering-lead
    frequency: event
    type: hybrid
    evidence:
      - {artifact: Emergency-labeled PRs with retro review, via: "collector:github_changes"}
    iso27001: [A.8.32]

  - id: CHG-04
    title: Environment separation
    description: Development, test and production are separate subscriptions; production customer data is not copied to lower environments.
    criteria: [CC6.1, CC8.1, C1.1]
    owner: engineering-lead
    frequency: continuous
    type: hybrid
    evidence:
      - {artifact: Subscription and resource inventory by environment tag, via: "collector:azure_inventory"}
    iso27001: [A.8.31, A.8.33]

  - id: CHG-05
    title: Secure development lifecycle
    description: Secure coding standards, code review and SAST (Semgrep Community Edition) run on every pull request.
    criteria: [CC5.2, CC7.1, CC8.1]
    owner: engineering-lead
    frequency: event
    type: automated
    evidence:
      - {artifact: Required checks list, via: "collector:github_branch_protection"}
    iso27001: [A.8.25, A.8.28, A.8.29]

  # ===================== Continuity and availability =====================
  - id: BCP-01
    title: Business continuity and disaster recovery plan
    description: BC/DR plan defines RTO and RPO per service and is tested annually.
    criteria: [CC7.4, CC7.5, CC9.1, A1.2, A1.3]
    owner: engineering-lead
    frequency: annual
    type: manual
    evidence:
      - {artifact: BC/DR plan, via: "git:policies/business-continuity.md"}
      - {artifact: Annual DR test report, via: "task:dr-test"}
