  - id: BCP-02
    title: Automated, protected backups
    description: Production data is backed up automatically with geo-redundancy and soft delete; job health is checked daily.
    criteria: [CC9.1, A1.2, C1.1, PI1.5]
    owner: engineering-lead
    frequency: daily
    type: automated
    evidence:
      - {artifact: Backup items and last job status, via: "collector:azure_backup"}
    iso27001: [A.8.13, A.8.14]

  - id: BCP-03
    title: Quarterly restore test
    description: A restore from backup is performed quarterly into an isolated environment and timed against RTO/RPO.
    criteria: [A1.3, A1.2]
    owner: engineering-lead
    frequency: quarterly
    type: manual
    evidence:
      - {artifact: Restore test record, via: "task:restore-test"}
    iso27001: [A.8.13]

  - id: BCP-04
    title: Capacity and performance monitoring
    description: Azure Monitor alerts on capacity thresholds; capacity is reviewed quarterly.
