  - id: BCP-05
    title: Cyber insurance reviewed
    description: Cyber insurance coverage is reviewed annually against the risk register.
    criteria: [CC9.1]
    owner: finance-lead
    frequency: annual
    type: manual
    evidence:
      - {artifact: Policy summary and review note, via: "task:insurance-review"}
    iso27001: [A.5.29]

  # ===================== Vendors =====================
  - id: VEN-01
    title: Vendor register and due diligence
    description: Every vendor with access to company or customer data is in the register with a risk tier; new vendors get a security review before onboarding.
    criteria: [CC1.3, CC3.2, CC3.4, CC5.2, CC9.2, P6.4]
    owner: security-lead
    frequency: event
    type: hybrid
    evidence:
      - {artifact: Vendor register history, via: "git:registers/vendors.yaml"}
    iso27001: [A.5.19, A.5.21]

  - id: VEN-02
    title: Annual review of critical vendors
    description: Critical vendors' SOC 2 reports are reviewed annually; their CUECs are mapped to the company's controls.
    criteria: [CC4.1, CC9.2, P6.1, P6.4]
    owner: security-lead
    frequency: annual
    type: manual
    evidence:
      - {artifact: Vendor review issues with report and CUEC mapping, via: "task:vendor-review"}
    iso27001: [A.5.22]

  - id: VEN-03
    title: Contractual security terms
    description: Vendor and customer contracts include confidentiality, data protection, breach notification and sub-processor terms.
    criteria: [CC1.1, CC2.3, CC9.2, C1.1, P6.1, P6.4, P6.5]
    owner: legal-lead
    frequency: event
    type: manual
    evidence:
      - {artifact: Contract templates and sampled executed contracts, via: "task:external-comms-review"}
    iso27001: [A.5.20]

  - id: VEN-04
    title: Physical security inherited and office controls
    description: Data center physical security is inherited from Microsoft (reviewed via its SOC 2 report); office access controls are reviewed annually.
    criteria: [CC6.4, A1.2]
    owner: it-lead
    frequency: annual
    type: manual
    evidence:
      - {artifact: Microsoft SOC 2 review and office access review, via: "task:vendor-review"}
    iso27001: [A.7.1, A.7.2]

  - id: VEN-05
    title: Vendor offboarding
    description: When a vendor relationship ends, its sign-in and API access are removed, company data is returned or deleted with the vendor's confirmation, and the contract is closed. Evidence is kept per vendor on the Vendors page.
    criteria: [CC9.2, C1.2]
    owner: security-lead
    frequency: event
    type: manual
    evidence:
      - {artifact: Offboarding checklist with evidence for vendors offboarded in the period (Vendors page and auditor export), via: event}
    iso27001: [A.5.19, A.5.20]

