# Recurring manual and hybrid control tasks. They appear on the portal's Security calendar, where an
# admin records each occurrence as performed, performed late, not performed or not applicable.
# cadence: monthly | quarterly | annual ; months: which months it opens (on the 1st, 1-12)
# due_days: days after opening; due_time: optional "HH:MM" (default 17:00)
# Without the portal, `grcpal tasks` opens a GitHub issue per task due this month instead.

tasks:
  leadership-review:
    title: Quarterly leadership security review
    cadence: quarterly
    months: [1, 4, 7, 10]
    due_days: 21
    owner: executive-sponsor
    approver: executive-sponsor
    checklist:
      - Present KPI report generated by `grcpal report`
      - Review open deficiencies and risk changes
      - Confirm the security reporting channel is monitored (sample reports)
      - Attach minutes with attendees and decisions

  policy-review:
    title: Annual policy review
    cadence: annual
    months: [9]
    due_days: 30
    owner: security-lead
    approver: executive-sponsor
    checklist:
      - Each policy owner reviews and opens a PR (even if no change, bump review date)
      - Executive sponsor approves the PRs
      - Link merged PRs here

  policy-acknowledgment:
    title: Annual policy acknowledgment campaign
    cadence: annual
    months: [10]
    due_days: 30
    owner: hr-lead
    approver: security-lead
    checklist:
      - Send acknowledgment form (Microsoft Forms) for Code of Conduct, AUP and policy set
      - Attach completion export; chase non-completers
      - Confirm 100% completion or list exceptions

  external-comms-review:
    title: Annual review of external commitments and contracts
    cadence: annual
    months: [8]
    due_days: 30
    owner: legal-lead
    approver: executive-sponsor
    checklist:
      - Review contract security terms, SLAs and DPA templates
      - Confirm trust page and customer incident-reporting channel are current
      - Sample 3 executed vendor contracts for security terms

  risk-assessment:
    title: Annual risk assessment
    cadence: annual
    months: [2]
    due_days: 30
    owner: security-lead
    approver: executive-sponsor
    checklist:
      - Workshop with Engineering, IT, HR, Legal, Finance (include fraud scenarios)
      - Update registers/risks.yaml through a PR with likelihood, impact, owner, treatment
      - Confirm each risk maps to controls (`grcpal validate` passes)
      - Executive sponsor approves

  internal-control-review:
    title: Annual internal control review
    cadence: annual
    months: [6]
    due_days: 45
    owner: security-lead
    approver: executive-sponsor
    checklist:
      - Walk through each control; sample evidence as an auditor would
      - Record results and log failures in registers/exceptions.yaml

  penetration-test:
    title: Annual penetration test
    cadence: annual
    months: [3]
    due_days: 60
    owner: security-lead
    approver: executive-sponsor
    checklist:
      - Engage independent tester; attach scope and rules of engagement
      - Attach report; open issues for each critical and high finding
      - Attach retest results

  hr-quarterly-attestation:
    title: Quarterly HR security attestation
    cadence: quarterly
    months: [1, 4, 7, 10]
    due_days: 21
    owner: hr-lead
    approver: security-lead
    checklist:
      - Attach hire list for the quarter with background check completion dates
      - Confirm confidentiality agreements signed for each hire
      - Attach leaver list (feeds leaver reconciliation)
      - Attach device return and wipe records for leavers

  training-completion:
    title: Security awareness training completion
    cadence: quarterly
    months: [1, 4, 7, 10]
    due_days: 14
    owner: hr-lead
    approver: security-lead
    checklist:
      - Attach completion export (new hires within 30 days; annual for all)
      - List overdue staff and follow-up

  access-review:
    title: Quarterly user access review
    cadence: quarterly
    months: [1, 4, 7, 10]
    due_days: 21
    owner: system-owners
    approver: security-lead
    checklist:
      - Collector exports attached automatically (users, roles, guests, Azure RBAC)
      - Each system owner marks keep or remove per user and comments "Reviewed"
      - Removals completed and linked
      - Security lead approves

  endpoint-config-review:
    title: Annual endpoint configuration review
    cadence: annual
    months: [5]
    due_days: 30
    owner: it-lead
    approver: security-lead
    checklist:
      - Export Intune compliance and configuration profiles (removable media, DLP)
      - Confirm they match the Endpoint policy

  ir-tabletop:
    title: Annual incident response tabletop
    cadence: annual
    months: [5]
    due_days: 30
    owner: security-lead
    approver: executive-sponsor
    checklist:
      - Run scenario with Engineering, IT, Legal, leadership
      - Attach after-action report and open action issues

  dr-test:
    title: Annual disaster recovery test
    cadence: annual
    months: [11]
    due_days: 30
    owner: engineering-lead
    approver: executive-sponsor
    checklist:
      - Execute DR plan for a critical service; record timings versus RTO and RPO
      - Attach results and lessons learned

  restore-test:
    title: Quarterly backup restore test
    cadence: quarterly
    months: [2, 5, 8, 11]
    due_days: 14
    owner: engineering-lead
    approver: security-lead
    checklist:
      - Restore a production backup into an isolated environment
      - Record start, end, data verified, and RPO achieved

  capacity-review:
    title: Quarterly capacity review
    cadence: quarterly
    months: [3, 6, 9, 12]
    due_days: 14
    owner: engineering-lead
    approver: engineering-lead
    checklist:
      - Review utilization trends and alert history
      - Record actions

  insurance-review:
    title: Annual cyber insurance review
    cadence: annual
    months: [12]
    due_days: 30
    owner: finance-lead
    approver: executive-sponsor
    checklist:
      - Compare coverage to top risks in the register
      - Attach policy summary

  vendor-review:
    title: Annual critical vendor review
    cadence: annual
    months: [7]
    due_days: 45
    owner: security-lead
    approver: executive-sponsor
    checklist:
      - For each critical vendor in registers/vendors.yaml, attach the current SOC 2 report or questionnaire
      - Map their CUECs to the company's controls (include Microsoft for physical security)
      - Review office physical access controls

  privacy-review:
    title: Annual privacy review
    cadence: annual
    months: [8]
    due_days: 30
    owner: legal-lead
    approver: executive-sponsor
    checklist:
      - Review privacy notice, consent records, data inventory versus purposes
      - Review disclosure log, sub-processor list, complaints
