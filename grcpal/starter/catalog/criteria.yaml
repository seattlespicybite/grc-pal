# AICPA 2017 Trust Services Criteria (revised points of focus 2022).
# Titles are short paraphrases for navigation, not the official criterion text.
# Keep the official AICPA text in your licensed copy for audit reference.

categories:
  security:
    name: Security (Common Criteria)
    mandatory: true
  availability:
    name: Availability
  confidentiality:
    name: Confidentiality
  processing_integrity:
    name: Processing Integrity
  privacy:
    name: Privacy

criteria:
  # ---- CC1 Control environment ----
  CC1.1: {category: security, title: "Commitment to integrity and ethical values"}
  CC1.2: {category: security, title: "Board independence and oversight of internal control"}
  CC1.3: {category: security, title: "Structures, reporting lines, authorities and responsibilities"}
  CC1.4: {category: security, title: "Attract, develop and retain competent individuals"}
  CC1.5: {category: security, title: "Hold individuals accountable for internal control"}
  # ---- CC2 Communication and information ----
  CC2.1: {category: security, title: "Obtain and use relevant, quality information"}
  CC2.2: {category: security, title: "Internal communication of objectives and responsibilities"}
  CC2.3: {category: security, title: "Communication with external parties"}
  # ---- CC3 Risk assessment ----
  CC3.1: {category: security, title: "Specify objectives clearly enough to identify risks"}
  CC3.2: {category: security, title: "Identify and analyze risks to objectives"}
  CC3.3: {category: security, title: "Consider potential for fraud"}
  CC3.4: {category: security, title: "Identify and assess changes that affect internal control"}
  # ---- CC4 Monitoring activities ----
  CC4.1: {category: security, title: "Ongoing and separate evaluations of controls"}
  CC4.2: {category: security, title: "Evaluate and communicate control deficiencies"}
  # ---- CC5 Control activities ----
  CC5.1: {category: security, title: "Select and develop control activities that mitigate risk"}
  CC5.2: {category: security, title: "Select and develop general controls over technology"}
  CC5.3: {category: security, title: "Deploy controls through policies and procedures"}
  # ---- CC6 Logical and physical access ----
  CC6.1: {category: security, title: "Logical access security software, infrastructure and architecture"}
  CC6.2: {category: security, title: "Register, authorize and remove users"}
  CC6.3: {category: security, title: "Role-based access, least privilege and access changes"}
  CC6.4: {category: security, title: "Restrict physical access to facilities and assets"}
  CC6.5: {category: security, title: "Discontinue protections when assets are disposed"}
  CC6.6: {category: security, title: "Protect against threats from outside system boundaries"}
  CC6.7: {category: security, title: "Restrict transmission, movement and removal of information"}
  CC6.8: {category: security, title: "Prevent or detect unauthorized or malicious software"}
  # ---- CC7 System operations ----
  CC7.1: {category: security, title: "Detect configuration changes and new vulnerabilities"}
  CC7.2: {category: security, title: "Monitor system components for anomalies"}
  CC7.3: {category: security, title: "Evaluate security events to determine incidents"}
  CC7.4: {category: security, title: "Respond to identified security incidents"}
  CC7.5: {category: security, title: "Recover from identified security incidents"}
  # ---- CC8 Change management ----
  CC8.1: {category: security, title: "Authorize, design, test, approve and implement changes"}
  # ---- CC9 Risk mitigation ----
  CC9.1: {category: security, title: "Mitigate risks from potential business disruptions"}
  CC9.2: {category: security, title: "Assess and manage vendor and business partner risk"}
  # ---- Availability ----
  A1.1: {category: availability, title: "Manage capacity to meet objectives"}
  A1.2: {category: availability, title: "Environmental protections, backups and recovery infrastructure"}
  A1.3: {category: availability, title: "Test recovery plan procedures"}
  # ---- Confidentiality ----
  C1.1: {category: confidentiality, title: "Identify and maintain confidential information"}
  C1.2: {category: confidentiality, title: "Dispose of confidential information"}
  # ---- Processing integrity ----
  PI1.1: {category: processing_integrity, title: "Processing specifications and data definitions"}
  PI1.2: {category: processing_integrity, title: "Input completeness and accuracy"}
  PI1.3: {category: processing_integrity, title: "Processing completeness, accuracy and timeliness"}
  PI1.4: {category: processing_integrity, title: "Output completeness, accuracy and distribution"}
  PI1.5: {category: processing_integrity, title: "Storage of inputs, items in processing and outputs"}
  # ---- Privacy ----
  P1.1: {category: privacy, title: "Notice of privacy practices"}
  P2.1: {category: privacy, title: "Choice and consent"}
  P3.1: {category: privacy, title: "Collection limited to stated objectives"}
  P3.2: {category: privacy, title: "Explicit consent for sensitive collection"}
  P4.1: {category: privacy, title: "Use limited to stated objectives"}
  P4.2: {category: privacy, title: "Retention of personal information"}
  P4.3: {category: privacy, title: "Secure disposal of personal information"}
  P5.1: {category: privacy, title: "Data subject access"}
  P5.2: {category: privacy, title: "Correction of personal information"}
  P6.1: {category: privacy, title: "Disclosure to third parties with consent"}
  P6.2: {category: privacy, title: "Record of authorized disclosures"}
  P6.3: {category: privacy, title: "Record of unauthorized disclosures"}
  P6.4: {category: privacy, title: "Third-party commitments for personal information"}
  P6.5: {category: privacy, title: "Third-party notification of unauthorized disclosure"}
  P6.6: {category: privacy, title: "Breach and incident notification to data subjects"}
  P6.7: {category: privacy, title: "Accounting of disclosures to data subjects"}
  P7.1: {category: privacy, title: "Quality of personal information"}
  P8.1: {category: privacy, title: "Inquiries, complaints and disputes handling"}
