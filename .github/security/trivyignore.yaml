# Trivy suppressions for the image scan (.github/workflows/security-scan.yml).
# Every entry needs a statement (why it does not apply or why it can wait) and expired_at (the review
# date). After that date Trivy reports the finding again, so a suppression can never be forgotten.
#   vulnerabilities:
#     - id: CVE-2026-00000
#       paths: ["usr/lib/x86_64-linux-gnu/libexample.so.1"]   # optional: limit to one package path
#       statement: "Only reachable through X, which GRC-pal never calls. Owner: <name>."
#       expired_at: 2027-01-31
vulnerabilities:
  - id: CVE-2026-85091
    statement: >-
      zlib1g heap overflow in gz_vacate(), part of zlib's gzip-file API (gzopen/gzwrite). Python's zlib module
      calls only deflate/inflate (checked with nm on zlib.cpython-*.so) and Python's gzip module is written in
      Python on top of it, so GRC-pal never reaches gz_vacate. The fixed package (1:1.3.dfsg+really1.3.1-1+deb13u1)
      is not yet in python:3.12-slim (latest digest checked 2026-11-17 still has -1+b1); the runtime stage has no
      apt by design (tests/test_deploy.py), so the fix arrives with the next base-image digest bump. Owner: maintainer.
    expired_at: 2026-12-15
