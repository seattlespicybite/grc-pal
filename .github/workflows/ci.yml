name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev]" pyflakes
      - name: Browser for the real-browser smoke test
        if: matrix.python == '3.12'
        run: pip install playwright && python -m playwright install --with-deps chromium
      - run: python -m pyflakes grcpal tests
      - run: python -m pytest -q
      - name: Starter catalog validates
        run: grcpal validate

  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bicep compiles and azuredeploy.json is current
        run: |
          az bicep install
          az bicep build --file deploy/azure/main.bicep --outfile /tmp/azuredeploy.json
          python3 - <<'PY'
          import json
          a = json.load(open("/tmp/azuredeploy.json")); b = json.load(open("deploy/azure/azuredeploy.json"))
          for d in (a, b): d.get("metadata", {}).pop("_generator", None)
          assert a == b, "deploy/azure/azuredeploy.json is stale: run az bicep build and commit it"
          PY
      - run: bash -n deploy/azure/deploy.sh

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: grc-pal:ci
      - name: Smoke test the image
        run: |
          docker run -d --name grcpal-smoke -p 8000:8000 -e GRCPAL_ENV=development -e GRCPAL_AUTH_MODE=dev -e GRCPAL_DEMO=1 grc-pal:ci
          for i in $(seq 1 30); do curl -fs http://localhost:8000/healthz && break; sleep 1; done
          curl -fs http://localhost:8000/dev/login | grep -q "Choose a user"
          docker rm -f grcpal-smoke
