name: Release image
# Push a tag like v0.2.0 to publish ghcr.io/<owner>/grc-pal:0.2.0 and :latest (public, no login needed to pull).
on:
  push:
    tags: ["v*.*.*"]
permissions: {}   # nothing by default; the publish job asks for what it needs
env:
  # Same pinned Trivy as security-scan.yml (downloaded and checked against its SHA-256, no third-party action)
  TRIVY_VERSION: "0.75.0"
  TRIVY_SHA256: c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f
jobs:
  publish:
    runs-on: ubuntu-24.04
    environment: release   # waits for a required reviewer (Settings > Environments)
    permissions:
      contents: write      # create the GitHub release
      packages: write      # push to GHCR
      id-token: write      # keyless build provenance
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Version rules (tag matches the package; data model changes only in minor or major releases)
        env:
          TAG: ${{ github.ref_name }}
        run: |
          pip install .
          python -m grcpal.migrations --release-check "$TAG"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/grc-pal
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      # What is scanned is what ships: push by digest only (no tags yet), scan that digest, then tag it.
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/grc-pal,push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
      - name: Install Trivy (pinned version and checksum)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/trivy.tgz" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  $RUNNER_TEMP/trivy.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin" && tar -xzf "$RUNNER_TEMP/trivy.tgz" -C "$RUNNER_TEMP/bin" trivy
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Scan the pushed image (both platforms); stop before tagging on high or critical with a fix
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/grc-pal
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          for platform in linux/amd64 linux/arm64; do
            trivy image --quiet --platform "$platform" --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
              --exit-code 1 --ignorefile .github/security/trivyignore.yaml "$IMAGE@$DIGEST"
          done
      - name: Tag the scanned image (same digest; nothing is rebuilt)
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/grc-pal
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          args=()
          while read -r t; do [ -n "$t" ] && args+=(-t "$t"); done <<< "$TAGS"
          docker buildx imagetools create "${args[@]}" "$IMAGE@$DIGEST"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/grc-pal
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Create the GitHub release (built-in gh CLI, no third-party action)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
      - name: VM installer kit (install.sh, updater, systemd units, update signing public key)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          tar -czf "grcpal-vm-installer-${TAG#v}.tar.gz" -C deploy vm
          gh release upload "$TAG" "grcpal-vm-installer-${TAG#v}.tar.gz" --repo "$GITHUB_REPOSITORY"
      - name: Signed update file for VM installs (.grcupdate, linux/amd64)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/grc-pal
          DIGEST: ${{ steps.build.outputs.digest }}
          GRCPAL_UPDATE_SIGNING_KEY: ${{ secrets.GRCPAL_UPDATE_SIGNING_KEY }}
        run: |
          if [ -z "$GRCPAL_UPDATE_SIGNING_KEY" ]; then
            echo "::warning::The GRCPAL_UPDATE_SIGNING_KEY secret is not set, so no signed update file was made (docs/deploy-vm.md, 'Release signing key')"
            exit 0
          fi
          if ! grep -q "BEGIN PUBLIC KEY" deploy/vm/update-signing.pub; then
            echo "::error::deploy/vm/update-signing.pub is empty: VMs could not check this update file. Commit the public key first."
            exit 1
          fi
          VERSION="${TAG#v}"
          REF="$IMAGE:$VERSION"
          docker pull --platform linux/amd64 "$IMAGE@$DIGEST"
          docker tag "$IMAGE@$DIGEST" "$REF"
          docker save -o image.tar "$REF"
          # The image ID a VM's Docker reports after `docker load` is the digest of the image config inside the file.
          IMAGE_ID=$(python3 - <<'PY'
          import json, tarfile
          with tarfile.open("image.tar") as t:
              cfg = json.load(t.extractfile("manifest.json"))[0]["Config"]
          print("sha256:" + cfg.rsplit("/", 1)[-1].removesuffix(".json"))
          PY
          )
          printf 'GRC-pal %s. Release notes: %s/%s/releases/tag/%s\n' "$VERSION" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$TAG" > notes.txt
          grcpal update bundle --out "grcpal-$VERSION.grcupdate" --image-tar image.tar --version "$VERSION" \
            --image-ref "$REF" --image-id "$IMAGE_ID" --notes-file notes.txt
          grcpal update verify "grcpal-$VERSION.grcupdate" --public-key deploy/vm/update-signing.pub
          sha256sum "grcpal-$VERSION.grcupdate" > "grcpal-$VERSION.grcupdate.sha256"
          gh release upload "$TAG" "grcpal-$VERSION.grcupdate" "grcpal-$VERSION.grcupdate.sha256" --repo "$GITHUB_REPOSITORY"
