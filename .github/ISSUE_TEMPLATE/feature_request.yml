name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes: {label: Problem, description: "What are you trying to do? Which control or framework requirement is involved?"}
    validations: {required: true}
  - type: textarea
    id: idea
    attributes: {label: Proposed solution}
  - type: textarea
    id: audit
    attributes: {label: Audit impact, description: "What evidence would this produce, and how would an auditor test it?"}
