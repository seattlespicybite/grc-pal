version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule: {interval: weekly}
    cooldown: {default-days: 7}     # skip versions younger than a week (hijacked releases are usually caught by then)
    groups:
      python: {patterns: ["*"]}
  - package-ecosystem: pip
    directory: /.github/security    # pinned scanner tools for security-scan.yml (bandit, pip-audit)
    schedule: {interval: weekly}
    cooldown: {default-days: 7}
    groups:
      security-tools: {patterns: ["*"]}
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
    cooldown: {default-days: 7}
  - package-ecosystem: pip
    directory: /requirements        # hash-locked packages the image installs (Dockerfile); regenerate with uv after pyproject changes
    schedule: {interval: weekly}
    cooldown: {default-days: 7}
    groups:
      image: {patterns: ["*"]}
  - package-ecosystem: docker
    directory: /                    # the base image is pinned by digest; this proposes new digests
    schedule: {interval: weekly}
    cooldown: {default-days: 7}
  - package-ecosystem: docker-compose
    directory: /
    schedule: {interval: monthly}
