[project]
name = "grc-pal"
version = "0.5.0"
description = "GRC-pal: open-source SOC 2 compliance automation with an evidence portal"
requires-python = ">=3.11"
readme = "README.md"
license = {text = "AGPL-3.0-or-later"}
authors = [{name = "GRC-pal contributors"}]
keywords = ["soc2", "compliance", "grc", "audit", "evidence", "security"]
classifiers = [
  "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
dependencies = [
  "azure-identity>=1.15",
  "azure-storage-blob>=12.19",
  "requests>=2.31",
  "pyyaml>=6.0",
  "cryptography>=42",
]

[project.optional-dependencies]
portal = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "jinja2>=3.1", "python-multipart>=0.0.9", "azure-data-tables>=12.5"]
aws = ["boto3>=1.34"]
gcp = ["google-auth>=2.29"]
all = ["grc-pal[portal,aws,gcp]"]
dev = ["pytest>=8", "httpx>=0.27", "pyflakes>=3", "python-docx>=1.1", "grc-pal[portal,aws,gcp]"]

[project.scripts]
grcpal = "grcpal.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["grcpal*"]

[tool.setuptools.package-data]
"grcpal.portal" = ["templates/*.html", "templates/email/*", "static/*"]
"grcpal" = ["starter/**/*", "starter/**/.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"   # short failure output: easier to read, fewer AI tokens
